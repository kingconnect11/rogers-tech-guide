<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roger's Guide">
<title>Roger's Guide — AI, Social Media & Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ========== RESET & BASE ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Source Sans 3', -apple-system, sans-serif;
  font-size: 18px;
  line-height: 1.7;
  color: #1a2744;
  background: #faf8f5;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ========== CSS VARIABLES ========== */
:root {
  --navy: #1a2744;
  --navy-light: #2a3d5e;
  --cream: #faf8f5;
  --ivory: #f5f0e8;
  --gold: #c8956c;
  --gold-light: #dbb08a;
  --gold-dark: #a67c52;
  --warm-blue: #4a6fa5;
  --sage: #7a9e7e;
  --sage-light: #a8c5ab;
  --text: #1a2744;
  --text-light: #5a6a7e;
  --text-muted: #8a95a5;
  --border: #e8e0d4;
  --shadow: rgba(26, 39, 68, 0.08);
  --shadow-md: rgba(26, 39, 68, 0.12);
  --radius: 12px;
  --radius-lg: 20px;
  --radius-sm: 8px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --nav-height: 72px;
  --sidebar-width: 260px;
  --content-max: 760px;
}

/* ========== TYPOGRAPHY ========== */
h1, h2, h3, h4, h5 {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 700;
  line-height: 1.25;
  color: var(--navy);
}
h1 { font-size: clamp(2rem, 5vw, 3.2rem); letter-spacing: -0.02em; }
h2 { font-size: clamp(1.6rem, 4vw, 2.4rem); letter-spacing: -0.01em; }
h3 { font-size: clamp(1.25rem, 3vw, 1.6rem); }
h4 { font-size: 1.15rem; font-weight: 600; }

p { margin-bottom: 1em; color: var(--text); }
a { color: var(--gold-dark); text-decoration: none; transition: color var(--transition); }
a:hover { color: var(--gold); }
strong { font-weight: 600; }
img { max-width: 100%; height: auto; display: block; }

/* ========== SUBTLE GRAIN TEXTURE ========== */
.grain::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  opacity: 0.035;
  pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-size: 200px 200px;
}

/* ========== LAYOUT ========== */
#root { min-height: 100vh; display: flex; flex-direction: column; }

/* ========== NAVIGATION — MOBILE BOTTOM BAR ========== */
.mobile-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 1000;
  background: rgba(250, 248, 245, 0.88);
  backdrop-filter: blur(20px) saturate(1.8);
  -webkit-backdrop-filter: blur(20px) saturate(1.8);
  border-top: 1px solid var(--border);
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  display: flex;
  justify-content: space-around;
  align-items: center;
}
.mobile-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 4px;
  border: none;
  background: none;
  cursor: pointer;
  min-width: 56px;
  min-height: 44px;
  border-radius: var(--radius-sm);
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.mobile-nav-btn svg { width: 22px; height: 22px; stroke: var(--text-muted); transition: all var(--transition); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mobile-nav-btn span { font-size: 10px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.02em; transition: color var(--transition); }
.mobile-nav-btn.active svg { stroke: var(--gold); }
.mobile-nav-btn.active span { color: var(--gold); }
.mobile-nav-btn:active { transform: scale(0.92); }

/* ========== NAVIGATION — DESKTOP SIDEBAR ========== */
.sidebar {
  position: fixed;
  top: 0;
  left: 0;
  width: var(--sidebar-width);
  height: 100vh;
  background: var(--cream);
  border-right: 1px solid var(--border);
  padding: 32px 20px;
  display: none;
  flex-direction: column;
  overflow-y: auto;
  z-index: 100;
}
.sidebar-logo {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 8px;
  cursor: pointer;
  transition: color var(--transition);
}
.sidebar-logo:hover { color: var(--gold); }
.sidebar-subtitle {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 32px;
  line-height: 1.5;
}
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: var(--radius-sm);
  font-size: 15px;
  font-weight: 500;
  color: var(--text-light);
  cursor: pointer;
  transition: all var(--transition);
  margin-bottom: 2px;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
}
.sidebar-link:hover { background: var(--ivory); color: var(--navy); }
.sidebar-link.active { background: var(--ivory); color: var(--gold-dark); font-weight: 600; }
.sidebar-link svg { width: 20px; height: 20px; flex-shrink: 0; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sidebar-divider { height: 1px; background: var(--border); margin: 16px 0; }
.sidebar-footer { margin-top: auto; padding-top: 20px; font-size: 13px; color: var(--text-muted); line-height: 1.5; }

/* ========== MAIN CONTENT ========== */
.main-content {
  flex: 1;
  padding-bottom: calc(var(--nav-height) + env(safe-area-inset-bottom) + 20px);
  min-height: 100vh;
}

/* ========== PAGE TRANSITIONS ========== */
.page-enter { opacity: 0; transform: translateY(16px); }
.page-active { opacity: 1; transform: translateY(0); transition: opacity 0.4s ease, transform 0.4s ease; }
.page-exit { opacity: 0; transform: translateY(-8px); transition: opacity 0.2s ease, transform 0.2s ease; }

/* ========== LANDING PAGE ========== */
.hero {
  position: relative;
  min-height: 85vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 60px 24px 40px;
  overflow: hidden;
}
.hero-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 0;
}
.hero-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 20%;
}
.hero-bg::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(
    to bottom,
    rgba(26, 39, 68, 0.55) 0%,
    rgba(26, 39, 68, 0.70) 50%,
    rgba(26, 39, 68, 0.88) 100%
  );
}
.hero-content {
  position: relative;
  z-index: 1;
  max-width: var(--content-max);
  margin: 0 auto;
  text-align: center;
}
.hero h1 {
  color: #fff;
  font-size: clamp(2.2rem, 6vw, 3.6rem);
  margin-bottom: 16px;
  font-weight: 700;
  text-shadow: 0 2px 12px rgba(0,0,0,0.2);
}
.hero-subtitle {
  color: rgba(255,255,255,0.85);
  font-size: clamp(1.05rem, 2.5vw, 1.3rem);
  font-weight: 300;
  max-width: 540px;
  margin: 0 auto 12px;
  line-height: 1.6;
}
.hero-from {
  color: var(--gold-light);
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-size: 1.05rem;
  margin-top: 8px;
}
.hero-scroll-hint {
  position: absolute;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1;
  color: rgba(255,255,255,0.5);
  animation: gentleBounce 2.5s ease-in-out infinite;
  cursor: pointer;
}
.hero-scroll-hint svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2; }
@keyframes gentleBounce {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(8px); }
}

/* ========== SECTION CARDS GRID ========== */
.cards-section {
  padding: 48px 24px 60px;
  max-width: 900px;
  margin: 0 auto;
}
.cards-section-title {
  text-align: center;
  font-size: 1rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 32px;
}
.cards-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 16px;
}
.section-card {
  position: relative;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 24px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 20px;
  overflow: hidden;
  min-height: 88px;
}
.section-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  border-radius: 4px 0 0 4px;
  transition: width var(--transition);
}
.section-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 32px var(--shadow-md);
  border-color: transparent;
}
.section-card:hover::before { width: 5px; }
.section-card:active { transform: translateY(-1px); }

.card-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  transition: transform var(--transition);
}
.section-card:hover .card-icon { transform: scale(1.08); }
.card-text { flex: 1; }
.card-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 4px;
}
.card-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--navy);
  margin-bottom: 4px;
}
.card-desc { font-size: 14px; color: var(--text-light); line-height: 1.5; margin: 0; }
.card-arrow { color: var(--text-muted); transition: all var(--transition); flex-shrink: 0; }
.card-arrow svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }
.section-card:hover .card-arrow { color: var(--gold); transform: translateX(4px); }

/* Card accent colors */
.card-gold::before { background: var(--gold); }
.card-gold .card-icon { background: rgba(200, 149, 108, 0.12); }
.card-gold .card-label { color: var(--gold-dark); }

.card-blue::before { background: var(--warm-blue); }
.card-blue .card-icon { background: rgba(74, 111, 165, 0.12); }
.card-blue .card-label { color: var(--warm-blue); }

.card-navy::before { background: var(--navy); }
.card-navy .card-icon { background: rgba(26, 39, 68, 0.10); }
.card-navy .card-label { color: var(--navy-light); }

.card-sage::before { background: var(--sage); }
.card-sage .card-icon { background: rgba(122, 158, 126, 0.12); }
.card-sage .card-label { color: var(--sage); }

.card-amber::before { background: #c0884a; }
.card-amber .card-icon { background: rgba(192, 136, 74, 0.12); }
.card-amber .card-label { color: #b07a40; }

.card-spark::before { background: linear-gradient(135deg, var(--gold), var(--warm-blue)); }
.card-spark .card-icon { background: linear-gradient(135deg, rgba(200,149,108,0.15), rgba(74,111,165,0.15)); }
.card-spark .card-label { color: var(--gold-dark); }

/* ========== SECTION PAGE LAYOUT ========== */
.section-page { padding: 0 0 40px; }
.section-hero {
  position: relative;
  height: 280px;
  overflow: hidden;
  margin-bottom: 0;
}
.section-hero img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.section-hero-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(to bottom, rgba(26,39,68,0.3) 0%, rgba(26,39,68,0.75) 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 24px;
}
.section-hero-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--gold-light);
  margin-bottom: 8px;
}
.section-hero-title {
  color: #fff;
  font-size: clamp(1.8rem, 4.5vw, 2.6rem);
  text-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.section-body {
  max-width: var(--content-max);
  margin: 0 auto;
  padding: 32px 24px;
}
.section-intro {
  font-size: 1.1rem;
  line-height: 1.8;
  color: var(--text);
  margin-bottom: 36px;
  font-weight: 300;
}
.section-intro strong { font-weight: 600; }

/* Back button */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 0;
  margin-bottom: 8px;
  border: none;
  background: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 500;
  color: var(--text-muted);
  transition: color var(--transition);
  -webkit-tap-highlight-color: transparent;
}
.back-btn:hover { color: var(--gold); }
.back-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ========== ACCORDION ========== */
.accordion { margin-bottom: 16px; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); background: #fff; }
.accordion-header {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 18px 20px;
  border: none;
  background: #fff;
  cursor: pointer;
  text-align: left;
  font-family: 'Playfair Display', serif;
  font-size: 1.1rem;
  font-weight: 600;
  color: var(--navy);
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
  min-height: 56px;
}
.accordion-header:hover { background: var(--ivory); }
.accordion-chevron {
  margin-left: auto;
  flex-shrink: 0;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  color: var(--text-muted);
}
.accordion-chevron svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2.5; }
.accordion.open .accordion-chevron { transform: rotate(180deg); color: var(--gold); }
.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}
.accordion.open .accordion-body { max-height: 5000px; }
.accordion-content {
  padding: 4px 20px 24px;
  font-size: 17px;
  line-height: 1.75;
}
.accordion-content p { margin-bottom: 14px; }
.accordion-content ul, .accordion-content ol { margin: 12px 0 18px 20px; }
.accordion-content li { margin-bottom: 8px; }
.accordion-content h4 { margin: 20px 0 10px; font-family: 'Source Sans 3', sans-serif; }

/* ========== PROMPT BLOCK ========== */
.prompt-block {
  position: relative;
  background: var(--navy);
  border-radius: var(--radius);
  padding: 20px;
  margin: 20px 0 24px;
  overflow: hidden;
}
.prompt-block::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--gold), var(--warm-blue));
}
.prompt-block pre {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  line-height: 1.65;
  color: rgba(255,255,255,0.9);
  white-space: pre-wrap;
  word-break: break-word;
  margin: 0;
  padding-right: 40px;
}
.prompt-copy-btn {
  position: absolute;
  top: 14px;
  right: 14px;
  padding: 8px 16px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.7);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  -webkit-tap-highlight-color: transparent;
}
.prompt-copy-btn:hover { background: rgba(255,255,255,0.15); color: #fff; border-color: rgba(255,255,255,0.3); }
.prompt-copy-btn.copied { background: rgba(122, 158, 126, 0.3); border-color: var(--sage); color: var(--sage-light); }
.prompt-copy-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ========== STEP-BY-STEP ========== */
.steps { margin: 20px 0; }
.step {
  display: flex;
  gap: 16px;
  margin-bottom: 24px;
  position: relative;
}
.step-num {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--gold);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
  flex-shrink: 0;
  margin-top: 2px;
}
.step-line {
  position: absolute;
  top: 40px;
  left: 18px;
  width: 2px;
  bottom: -8px;
  background: var(--border);
}
.step:last-child .step-line { display: none; }
.step-content { flex: 1; }
.step-title { font-weight: 600; font-size: 17px; margin-bottom: 6px; }

/* ========== COMPARISON TABLE ========== */
.comparison-table-wrap { overflow-x: auto; margin: 20px 0; -webkit-overflow-scrolling: touch; }
.comparison-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
  min-width: 500px;
}
.comparison-table th {
  text-align: left;
  padding: 12px 14px;
  background: var(--navy);
  color: #fff;
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.comparison-table th:first-child { border-radius: var(--radius-sm) 0 0 0; }
.comparison-table th:last-child { border-radius: 0 var(--radius-sm) 0 0; }
.comparison-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
  line-height: 1.5;
}
.comparison-table tr:nth-child(even) td { background: var(--ivory); }
.comparison-table td:first-child { font-weight: 600; color: var(--navy); white-space: nowrap; }

/* ========== PROJECT CARDS ========== */
.project-cards { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 20px 0; }
.project-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: all var(--transition);
}
.project-card:hover { box-shadow: 0 4px 16px var(--shadow); transform: translateY(-2px); }
.project-card-title { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1rem; margin-bottom: 4px; }
.project-card-desc { font-size: 14px; color: var(--text-light); margin: 0 0 8px; line-height: 1.5; }
.project-card-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tag-chat { background: rgba(74, 111, 165, 0.12); color: var(--warm-blue); }
.tag-cowork { background: rgba(200, 149, 108, 0.15); color: var(--gold-dark); }
.tag-research { background: rgba(122, 158, 126, 0.12); color: var(--sage); }

/* ========== PLATFORM CARDS ========== */
.platform-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px;
  margin-bottom: 16px;
}
.platform-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.platform-icon { font-size: 28px; }
.platform-name { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.2rem; }
.platform-purpose { font-weight: 600; color: var(--gold-dark); font-size: 15px; margin-bottom: 8px; }
.platform-card ul { margin: 8px 0 8px 20px; }
.platform-card li { margin-bottom: 6px; font-size: 16px; }
.platform-bottom-line {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  font-weight: 600;
  font-size: 15px;
  color: var(--navy);
}

/* ========== TIP / CALLOUT BOXES ========== */
.callout {
  border-left: 4px solid var(--gold);
  background: var(--ivory);
  padding: 16px 20px;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  margin: 16px 0 20px;
}
.callout.tip { border-left-color: var(--sage); }
.callout.info { border-left-color: var(--warm-blue); }
.callout-label { font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.callout p:last-child { margin-bottom: 0; }

/* ========== PHOTO IN CONTENT ========== */
.content-photo {
  border-radius: var(--radius);
  overflow: hidden;
  margin: 24px 0;
  box-shadow: 0 4px 20px var(--shadow);
}
.content-photo img {
  width: 100%;
  display: block;
}
.content-photo-caption {
  padding: 10px 16px;
  background: var(--ivory);
  font-size: 13px;
  color: var(--text-muted);
  font-style: italic;
}

/* ========== CAMERA DIVIDER ========== */
.camera-divider {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 40px 0;
  color: var(--border);
}
.camera-divider::before, .camera-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.camera-divider svg { width: 24px; height: 24px; stroke: var(--gold-light); fill: none; stroke-width: 1.5; flex-shrink: 0; }

/* ========== DECISION GUIDE ========== */
.decision-list { margin: 16px 0; }
.decision-item {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 8px 0;
  font-size: 16px;
}
.decision-item .q { color: var(--text-light); flex-shrink: 0; }
.decision-item .arrow { color: var(--gold); font-weight: 700; flex-shrink: 0; }
.decision-item .a { font-weight: 600; color: var(--navy); }

/* ========== FUN PROMPT TILES ========== */
.fun-prompts-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin: 20px 0; }
.fun-prompt-tile {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  cursor: pointer;
  transition: all var(--transition);
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.fun-prompt-tile:hover { border-color: var(--gold); box-shadow: 0 2px 12px var(--shadow); }
.fun-prompt-tile.copied-tile { border-color: var(--sage); background: rgba(122,158,126,0.05); }
.fun-tile-icon { font-size: 22px; flex-shrink: 0; margin-top: 2px; }
.fun-tile-text { font-size: 15px; line-height: 1.5; color: var(--text); }
.fun-tile-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; font-style: italic; }

/* ========== SECTION CLOSING MESSAGE ========== */
.closing-message {
  background: linear-gradient(135deg, var(--ivory), rgba(200,149,108,0.08));
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  margin-top: 32px;
  border: 1px solid rgba(200,149,108,0.2);
}
.closing-message p { font-size: 17px; line-height: 1.75; }
.closing-message p:last-child { margin-bottom: 0; }

/* ========== PHILIP MESSAGE PLACEHOLDER ========== */
.philip-note {
  text-align: center;
  padding: 40px 24px;
  margin: 0 24px 20px;
  border: 2px dashed var(--gold-light);
  border-radius: var(--radius-lg);
  background: rgba(200,149,108,0.04);
}
.philip-note-label {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  color: var(--gold-dark);
  font-size: 1.1rem;
  margin-bottom: 8px;
}
.philip-note p { color: var(--text-muted); font-size: 15px; margin: 0; }

/* ========== SCROLL REVEAL ========== */
.reveal { opacity: 0; transform: translateY(20px); transition: opacity 0.6s ease, transform 0.6s ease; }
.reveal.visible { opacity: 1; transform: translateY(0); }

/* ========== RESPONSIVE ========== */
@media (min-width: 640px) {
  .cards-grid { grid-template-columns: 1fr 1fr; }
  .project-cards { grid-template-columns: 1fr 1fr; }
  .fun-prompts-grid { grid-template-columns: 1fr 1fr; }
}

@media (min-width: 1024px) {
  .mobile-nav { display: none; }
  .sidebar { display: flex; }
  .main-content {
    margin-left: var(--sidebar-width);
    padding-bottom: 60px;
  }
  .hero { min-height: 80vh; }
  .section-hero { height: 340px; }
  .section-hero-overlay { padding: 40px; }
  .section-body { padding: 40px 40px; }
  .cards-section { padding: 60px 40px 80px; }
  .cards-grid { grid-template-columns: 1fr 1fr; gap: 20px; }
}

@media (min-width: 1200px) {
  .cards-grid { grid-template-columns: 1fr 1fr 1fr; }
}

/* ========== PROGRESS CHECKBOX ========== */
.progress-check {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: -4px 0 16px;
}
.progress-check input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--sage);
  cursor: pointer;
}
.progress-check label {
  font-size: 14px;
  color: var(--text-muted);
  cursor: pointer;
  user-select: none;
}

/* ========== BEFORE/AFTER EXAMPLE ========== */
.before-after { margin: 16px 0; }
.ba-item { padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 8px; }
.ba-bad { background: rgba(200, 80, 80, 0.08); border-left: 3px solid #c85050; }
.ba-good { background: rgba(122, 158, 126, 0.08); border-left: 3px solid var(--sage); }
.ba-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
.ba-bad .ba-label { color: #c85050; }
.ba-good .ba-label { color: var(--sage); }
.ba-text { font-size: 15px; color: var(--text); margin: 0; font-style: italic; }

/* ========== LOADING ANIMATION ========== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}
.stagger-1 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.1s; opacity: 0; }
.stagger-2 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.2s; opacity: 0; }
.stagger-3 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.3s; opacity: 0; }
.stagger-4 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.4s; opacity: 0; }
.stagger-5 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.5s; opacity: 0; }
.stagger-6 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.6s; opacity: 0; }
.stagger-7 { animation: fadeInUp 0.6s ease forwards; animation-delay: 0.7s; opacity: 0; }

</style>
</head>

  { id: 'getting-started', title: 'Getting Started', subtitle: 'Your first steps with AI', icon: '🚀', label: 'Start Here', colorClass: 'card-gold', image: 'images/roger-cool-glasses.jpg', imageAlt: 'Roger smiling with cool glasses' },

// ==================== UTILITY HOOKS ====================
function useScrollReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const observer = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { el.classList.add('visible'); observer.unobserve(el); } },
      { threshold: 0.1, rootMargin: '0px 0px -40px 0px' }
    );
    observer.observe(el);
    return () => observer.disconnect();
  }, []);
  return ref;
}

function useProgress() {
  const [progress, setProgress] = useState(() => {
    try { return JSON.parse(localStorage.getItem('rogers-guide-progress') || '{}'); } catch { return {}; }
  });
  const toggle = useCallback((key) => {
    setProgress(prev => {
      const next = { ...prev, [key]: !prev[key] };
      localStorage.setItem('rogers-guide-progress', JSON.stringify(next));
      return next;
    });
  }, []);
  return [progress, toggle];
}

// ==================== COMPONENTS ====================

// --- Camera Divider ---
function CameraDivider() {
  return <div className="camera-divider">{Icons.aperture}</div>;
}

// --- Accordion ---
function Accordion({ title, id, children, progress, toggleProgress }) {
  const [open, setOpen] = useState(false);
  return (
    <div className={`accordion ${open ? 'open' : ''}`}>
      <button className="accordion-header" onClick={() => setOpen(!open)}>
        <span>{title}</span>
        <span className="accordion-chevron">{Icons.chevDown}</span>
      </button>
      <div className="accordion-body">
        <div className="accordion-content">
          {progress && id && (
            <div className="progress-check">
              <input type="checkbox" id={`prog-${id}`} checked={!!progress[id]} onChange={() => toggleProgress(id)} />
              <label htmlFor={`prog-${id}`}>Mark as done</label>
            </div>
          )}
          {children}
        </div>
      </div>
    </div>
  );
}

// --- Prompt Block ---
function PromptBlock({ text }) {
  const [copied, setCopied] = useState(false);
  const handleCopy = async () => {
    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);
    } catch { /* fallback */ }
  };
  return (
    <div className="prompt-block">
      <pre>{text}</pre>
      <button className={`prompt-copy-btn ${copied ? 'copied' : ''}`} onClick={handleCopy}>
        {copied ? <>{Icons.check} Copied!</> : <>{Icons.copy} Copy</>}
      </button>
    </div>
  );
}

// --- Step by Step ---
function Steps({ steps }) {
  return (
    <div className="steps">
      {steps.map((s, i) => (
        <div className="step" key={i}>
          <div className="step-num">{i + 1}</div>
          <div className="step-line" />
          <div className="step-content">
            <div className="step-title">{s.title}</div>
            <div>{s.content}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// --- Comparison Table ---
function ComparisonTable({ headers, rows }) {
  return (
    <div className="comparison-table-wrap">
      <table className="comparison-table">
        <thead><tr>{headers.map((h,i) => <th key={i}>{h}</th>)}</tr></thead>
        <tbody>{rows.map((row,i) => <tr key={i}>{row.map((cell,j) => <td key={j}>{cell}</td>)}</tr>)}</tbody>
      </table>
    </div>
  );
}

// --- Fun Prompt Tile (click to copy) ---
function FunPromptTile({ emoji, text }) {
  const [copied, setCopied] = useState(false);

    try {
      await navigator.clipboard.writeText(text);
      setCopied(true);
      setTimeout(() => setCopied(false), 2000);

  };
  return (
    <div className={`fun-prompt-tile ${copied ? 'copied-tile' : ''}`} onClick={handleCopy}>

      <div>
        <div className="fun-tile-text">{text}</div>
        <div className="fun-tile-hint">{copied ? '✓ Copied!' : 'Tap to copy'}</div>
      </div>

  );
}

// --- Content Photo ---

// --- Section Page Shell ---
function SectionPage({ section, onBack, children }) {

  return (
    <div className="section-page page-active">

}

// ==================== APP SHELL ====================
function App() {
  const [page, setPage] = useState(() => {
    const hash = window.location.hash.replace('#', '');
    return hash || 'home';
  });
  const [progress, toggleProgress] = useProgress();

  useEffect(() => {
    const handleHash = () => {
      const hash = window.location.hash.replace('#', '');
      if (hash) setPage(hash);
    };
    window.addEventListener('hashchange', handleHash);
    return () => window.removeEventListener('hashchange', handleHash);
  }, []);

  const navigate = useCallback((id) => {
    setPage(id);
    window.location.hash = id;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  const goHome = useCallback(() => {
    setPage('home');
    window.location.hash = 'home';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  const sectionMap = {
    'getting-started': GettingStartedSection,
    'ai-personal': AIPersonalSection,
    'ai-professional': AIProSection,
    'social-personal': SocialPersonalSection,
    'social-professional': SocialProSection,
    'cool-stuff': CoolStuffSection,
  };

  const currentSection = SECTIONS.find(s => s.id === page);
  const SectionComponent = sectionMap[page];

  // Determine active nav tab
  const activeNav = page === 'home' ? 'home'
    : page === 'getting-started' ? 'getting-started'
    : page.startsWith('ai-') ? 'ai-personal'
    : page.startsWith('social-') ? 'social-personal'
    : page === 'cool-stuff' ? 'cool-stuff'
    : 'home';

  return (
    <>
      {/* Desktop Sidebar */}
      <nav className="sidebar">
        <div className="sidebar-logo" onClick={goHome}>Roger's Guide</div>
        <div className="sidebar-subtitle">AI, Social Media & Technology</div>
        <button className={`sidebar-link ${page === 'home' ? 'active' : ''}`} onClick={goHome}>
          {Icons.home}<span>Home</span>
        </button>
        <div className="sidebar-divider" />
        {SECTIONS.map(s => (
          <button
            key={s.id}
            className={`sidebar-link ${page === s.id ? 'active' : ''}`}
            onClick={() => navigate(s.id)}
          >
            <span style={{fontSize:'18px',width:'20px',textAlign:'center'}}>{s.icon}</span>
            <span>{s.title}</span>
          </button>
        ))}
        <div className="sidebar-footer">
          <p>Built with love by Philip.<br />Powered by Claude.</p>
        </div>
      </nav>

      {/* Main Content */}
      <main className="main-content">
        {page === 'home' && <LandingPage onNavigate={navigate} />}
        {SectionComponent && currentSection && (
          <SectionComponent
            section={currentSection}
            onBack={goHome}
            progress={progress}
            toggleProgress={toggleProgress}
          />
        )}
      </main>

      {/* Mobile Bottom Nav */}
      <nav className="mobile-nav">
        {NAV_ITEMS.map(item => (
          <button
            key={item.id}
            className={`mobile-nav-btn ${activeNav === item.id ? 'active' : ''}`}
            onClick={() => item.id === 'home' ? goHome() : navigate(item.id)}
          >
            {item.icon}
            <span>{item.label}</span>
          </button>
        ))}
      </nav>
    </>
  );
}

// ==================== MOUNT ====================
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
