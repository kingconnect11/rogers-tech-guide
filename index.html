<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf8f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roger's Guide">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Roger's Guide</title>
<meta name="description" content="Roger's business desk for Pitch an Angel: this week's plan, the offers, ChatGPT prompts, and what to build next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a2744;--ink-2:#3c4a63;--muted:#5f6b7d;
  --paper:#faf8f5;--card:#ffffff;--ivory:#f3eee5;--line:#e6ddcf;
  --gold:#b5835a;--gold-ink:#8a5f39;--gold-soft:#f6ecdf;
  --sage:#4f7d57;--sage-soft:#e6f0e6;
  --red:#b3263a;--red-soft:#fbecee;
  --blue:#3f6496;--blue-soft:#e9eff7;
  --code:#1e2433;--code-ink:#eef1f6;
  --radius:16px;--radius-sm:10px;
  --shadow:0 1px 2px rgba(26,39,68,.06),0 6px 18px rgba(26,39,68,.06);
  --nav-h:68px;--side-w:250px;--max:780px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:19px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.2;margin:0 0 .4em;color:var(--ink);font-variant-numeric:lining-nums}
h1{font-size:clamp(2rem,6vw,2.8rem);letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4.5vw,1.95rem);margin-top:0}
h3{font-size:1.25rem}
p{margin:0 0 1em}
a{color:var(--blue)}
strong{font-weight:700}
small,.small{font-size:16px;color:var(--muted)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
img{max-width:100%;display:block}
main:focus{outline:none}

/* Shell */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(250,248,245,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:'Playfair Display',serif;font-weight:700;font-size:1.2rem;text-decoration:none;color:var(--ink)}
.topbar .btn{min-height:40px;padding:6px 14px;font-size:16px}
main{max-width:var(--max);margin:0 auto;padding:20px 20px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;background:rgba(250,248,245,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;justify-content:center;text-decoration:none;color:var(--muted);font-size:13px;font-weight:700;border-radius:12px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);background:var(--ivory)}
.side{display:none}
@media (max-width:400px){.tab{font-size:12px}.tab svg{width:22px;height:22px}}
@media (min-width:1000px){
  .tabbar,.topbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:var(--side-w);padding:28px 18px;border-right:1px solid var(--line);background:var(--paper);overflow-y:auto}
  .side .brand{font-size:1.45rem;margin-bottom:4px}
  .side .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:10px 14px;font-size:17px;margin-bottom:2px}
  .side .sub{font-size:15px;color:var(--muted);margin:0 0 24px}
  .side .foot{margin-top:auto;font-size:15px;color:var(--muted)}
  .side .foot a{color:var(--muted)}
  main{margin-left:calc(var(--side-w) + max(0px,(100vw - var(--side-w) - var(--max)) / 2 - 20px));margin-right:auto;padding:40px 32px 80px}
}

/* Blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);margin:0 0 18px}
.card.soft{background:var(--ivory);box-shadow:none}
.card.gold{background:var(--gold-soft);border-color:#ecd9c2;box-shadow:none}
.card.warn{background:var(--red-soft);border-color:#f0c9cf;box-shadow:none}
.card.ok{background:var(--sage-soft);border-color:#cfe1cf;box-shadow:none}
.card h2,.card h3{margin-top:0}
.section{margin:34px 0 14px}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 6px}
.lead{font-size:21px;color:var(--ink-2)}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:14px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 20px;border-radius:12px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:700;font-size:17px;text-decoration:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.small{min-height:40px;padding:6px 14px;font-size:16px}
.btn.done{background:var(--sage);border-color:var(--sage)}
.badge{display:inline-block;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--ivory);color:var(--ink-2);vertical-align:middle}
.badge.live{background:var(--sage-soft);color:var(--sage)}
.badge.new{background:var(--gold-soft);color:var(--gold-ink)}
.badge.soon{background:var(--blue-soft);color:var(--blue)}
ul.clean{list-style:none;padding:0;margin:0}
ul.dots{padding-left:1.2em;margin:0 0 1em}
ul.dots li{margin:.25em 0}
details{border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--card);margin:0 0 12px}
details>summary{cursor:pointer;list-style:none;padding:14px 18px;font-weight:700;min-height:48px;display:flex;align-items:center;justify-content:space-between;gap:12px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:'+';font-size:24px;color:var(--gold-ink);font-weight:400}
details[open]>summary::after{content:'\2212'}
details>.inner{padding:0 18px 16px}

/* Hero */
.hero{display:grid;border-radius:var(--radius);overflow:hidden;margin:0 0 20px;background:var(--ink);color:#fff}
.hero img{width:100%;height:240px;object-fit:cover;object-position:50% 18%}
.hero .txt{padding:22px 22px 24px;align-self:center}
.hero h1{color:#fff;margin:0 0 8px}
.hero p{color:rgba(255,255,255,.9);margin:0;font-size:19px}
@media (min-width:640px){.hero{grid-template-columns:240px 1fr}.hero img{height:100%;min-height:280px}.hero .txt{padding:28px 30px}}

/* Checklists */
.checks li{border-top:1px solid var(--line)}
.checks li:first-child{border-top:none}
.check{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:none;border:none;padding:14px 2px;cursor:pointer;min-height:56px}
.box{flex:none;width:30px;height:30px;border-radius:9px;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
.check[aria-pressed="true"] .box{background:var(--sage);border-color:var(--sage)}
.check[aria-pressed="true"] .box::after{content:'';width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}
.check .t{font-weight:600}
.check[aria-pressed="true"] .t{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(95,107,125,.5)}
.check .d{display:block;font-size:16px;color:var(--muted);font-weight:400;margin-top:2px}

/* Progress */
.meter{position:relative;height:18px;border-radius:999px;background:var(--ivory);border:1px solid var(--line);overflow:hidden;margin:16px 0 8px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),#c99a6f);border-radius:999px;transition:width .5s ease}
.marks{position:relative;height:44px;font-size:14px;color:var(--muted)}
.marks span{position:absolute;transform:translateX(-50%);text-align:center;white-space:nowrap;line-height:1.25}
.marks span b{display:block;color:var(--ink);font-size:15px}
.marks span.hit b{color:var(--sage)}
.big{font-family:'Playfair Display',serif;font-size:2.3rem;font-weight:700;line-height:1;font-variant-numeric:lining-nums}
.stat{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}

/* Forms */
label.f{display:block;font-weight:700;font-size:16px;margin:0 0 6px}
input.in,select.in,textarea.in{width:100%;font:inherit;font-size:18px;padding:11px 14px;border:1.5px solid #d8ccb9;border-radius:10px;background:#fff;color:var(--ink);min-height:48px}
textarea.in{min-height:110px;resize:vertical}
.fields{display:grid;gap:14px}
@media (min-width:640px){.fields.two{grid-template-columns:1fr 1fr}}

/* Prompts */
.prompt{background:var(--code);color:var(--code-ink);border-radius:var(--radius-sm);padding:16px 16px 12px;margin:10px 0 0}
.prompt pre{margin:0;white-space:pre-wrap;word-wrap:break-word;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:15px;line-height:1.55;max-height:340px;overflow:auto}
.prompt .bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.prompt .btn{background:#fff;color:var(--ink);border-color:#fff}
.prompt .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5)}
.msg{background:var(--ivory);border-left:4px solid var(--gold);border-radius:8px;padding:14px 16px;white-space:pre-wrap;margin:8px 0 10px;font-size:18px}

/* Offers */
.rung{margin:30px 0 10px;display:flex;align-items:center;gap:12px}
.rung .n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.rung h2{margin:0;font-size:1.45rem}
.offer .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.offer .price{font-variant-numeric:lining-nums;font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;white-space:nowrap}
.offer .who{font-size:16px;color:var(--muted);margin:2px 0 10px}
.launch{color:var(--red);font-weight:700;font-size:16px;margin:6px 0 0}
.say{font-style:italic;color:var(--ink-2);border-left:3px solid var(--gold);padding-left:12px;margin:12px 0 0}

/* Calculator */
.calc-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.calc-row:first-child{border-top:none}
.calc-row .nm{font-weight:600}
.calc-row .sub{font-size:15px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1.5px solid #d8ccb9;background:#fff;font-size:24px;line-height:1;cursor:pointer;color:var(--ink)}
.stepper output{min-width:30px;text-align:center;font-weight:700;font-size:20px}
.take-in{width:110px!important;min-height:40px!important;padding:6px 10px!important;font-size:16px!important}

/* People */
.person{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.person:first-child{border-top:none}
.person .nm{font-weight:700}
.person .nt{font-size:16px;color:var(--muted)}
.status{min-height:40px;padding:4px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:15px;cursor:pointer}
.status.s1{background:var(--blue-soft);border-color:#c9d6ea;color:var(--blue)}
.status.s2{background:var(--gold-soft);border-color:#ecd9c2;color:var(--gold-ink)}
.status.s3{background:var(--sage-soft);border-color:#cfe1cf;color:var(--sage)}
.linkbtn{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px;padding:6px}

/* Yes / no */
.q{padding:14px 0;border-top:1px solid var(--line)}
.q:first-child{border-top:none}
.q .qt{font-weight:600;margin:0 0 10px}
.yn{display:flex;gap:10px}
.yn button{flex:1;min-height:48px;border-radius:12px;border:2px solid #d8ccb9;background:#fff;font-weight:700;cursor:pointer}
.yn button[aria-pressed="true"].y{background:var(--sage);border-color:var(--sage);color:#fff}
.yn button[aria-pressed="true"].n{background:var(--red);border-color:var(--red);color:#fff}
.verdict{border-radius:var(--radius);padding:20px;margin:18px 0}
.verdict.go{background:var(--sage-soft);border:1px solid #cfe1cf}
.verdict.park{background:var(--red-soft);border:1px solid #f0c9cf}
.verdict.later{background:var(--gold-soft);border:1px solid #ecd9c2}
.verdict.wait{background:var(--ivory);border:1px solid var(--line)}

/* Field guide */
.tbl-wrap{overflow-x:auto;margin:10px 0 16px;border:1px solid var(--line);border-radius:var(--radius-sm);background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:17px}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:11px 14px;border-top:1px solid var(--line)}
.tbl thead th{border-top:none;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--ivory)}
.tbl tbody th{font-weight:700;white-space:normal;min-width:120px}
ol.steps{list-style:none;counter-reset:s;padding:0;margin:8px 0 16px}
ol.steps li{counter-increment:s;position:relative;padding:4px 0 12px 50px;min-height:40px}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
ol.steps li strong{display:block}
ol.steps li span{display:block;color:var(--ink-2);font-size:17px}
a.chapter{display:flex;gap:16px;align-items:center;text-decoration:none;color:inherit}
a.chapter .n{font-variant-numeric:lining-nums;flex:none;width:44px;height:44px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Playfair Display',serif;font-size:20px}
a.chapter .n.dot{background:var(--gold)}
a.chapter .ct{display:block;font-family:'Playfair Display',serif;font-weight:700;font-size:1.25rem}
a.chapter .cw{display:block;color:var(--muted);font-size:17px}
.pager{margin-top:28px;justify-content:space-between}
.linkback{font-weight:700;text-decoration:none}

/* Timeline */
.tl{border-left:3px solid var(--line);margin:10px 0 0 10px;padding-left:20px}
.tl .it{position:relative;margin:0 0 22px}
.tl .it::before{content:'';position:absolute;left:-29px;top:7px;width:15px;height:15px;border-radius:50%;background:var(--gold);border:3px solid var(--paper)}
.tl .it.now::before{background:var(--red)}
.tl .when{font-weight:700;color:var(--gold-ink);font-size:16px;text-transform:uppercase;letter-spacing:.08em}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;pointer-events:none;transition:all .25s;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:1000px){.toast{bottom:30px}}
.quote{font-variant-numeric:lining-nums;font-family:'Playfair Display',serif;font-size:1.25rem;line-height:1.45;color:var(--ink)}
.cite{font-size:15px;color:var(--muted);margin-top:8px}
hr.s{border:none;border-top:1px solid var(--line);margin:28px 0}
.foot-note{font-size:15px;color:var(--muted);margin-top:40px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.tabbar,.topbar,.side,.toast{display:none!important}main{margin:0;padding:0}}
</style>
</head>

<script>
(function () {
'use strict';

/* ---------- storage (each device keeps its own copy) ---------- */
var store = {
  get: function (k, d) { try { var v = localStorage.getItem('rg2.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem('rg2.' + k, JSON.stringify(v)); } catch (e) {} }
};

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function money(n) { return '$' + Math.round(n).toLocaleString('en-US'); }
function todayKey() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- the plan's dates and targets ---------- */
var TARGET_DATE = new Date('2026-11-18T23:59:00-08:00');
var TARGETS = [
  { key: 'floor', label: 'Floor', amount: 2500 },
  { key: 'goal', label: 'Goal', amount: 5000 },
  { key: 'stretch', label: 'Stretch', amount: 12500 }
];

var WEEKS = [
  { id: 'w1', title: 'Week 1', dates: '28 October to 3 November', ends: '2026-11-04', items: [
    { id: 'w1a', t: 'Send 25 personal messages, five a day', d: 'Who to ask and what to say are on the Plan tab.' },
    { id: 'w1b', t: 'Offer each current client their next step', d: 'A follow-up session, a Sprint, Philip\'s deck review, or the Full Program.' },
    { id: 'w1c', t: 'Ask George to open two doors for a workshop', d: 'The East Bay SBDC and Innovit. The pitch email is on the ChatGPT tab.' },
    { id: 'w1d', t: 'Agree the Full Program with Philip, Michael and George', d: 'Price, who does what, and how the money splits.' },
    { id: 'w1e', t: 'Give your ChatGPT the new offers file', d: 'Download it from the ChatGPT tab and add it to your Pitch an Angel project.' },
    { id: 'w1g', t: 'Try voice mode on one real email', d: 'Open your Pitch an Angel project, tap voice, talk it through, then say "Now write it up as an email." Guide, part 3.' },
    { id: 'w1f', t: 'Set up a free booking link with Philip', d: 'Calendly is gone from the website. Until the new link is in, your invite emails ask founders to reply with times.' }
  ]},
  { id: 'w2', title: 'Week 2', dates: '4 to 10 November', ends: '2026-11-11', items: [
    { id: 'w2a', t: 'Run the first Pitch Clinic', d: 'Pick the date with Philip. Six founders, five minutes each, your feedback.' },
    { id: 'w2b', t: 'Reply to every answer within a day', d: 'ChatGPT drafts, you send.' },
    { id: 'w2c', t: 'Send the workshop email to five organizations', d: 'Accelerators, incubators, university programs, small business centers.' },
    { id: 'w2d', t: 'Close the first Full Program', d: 'Half is paid at the start.' },
    { id: 'w2e', t: 'Take one founder end to end with ChatGPT', d: 'Prep packet, session, and the report within 48 hours. Guide, part 3.' }
  ]},
  { id: 'w3', title: 'Week 3', dates: '11 to 17 November', ends: '2026-11-18', items: [
    { id: 'w3a', t: 'Send every written report within 48 hours', d: 'Paste the Zoom transcript into ChatGPT with the report prompt.' },
    { id: 'w3b', t: 'Ask every happy founder for one sentence we can quote', d: 'With their permission, it goes on the website.' },

    var pos = left > 92 ? 'right:0;transform:none;text-align:right' : 'left:' + left + '%';
    return '<span style="' + pos + '" class="' + (total >= t.amount ? 'hit' : '') + '"><b>' + money(t.amount) + '</b>' + t.label + '</span>';
  }).join('');
  return '<div class="meter" role="img" aria-label="' + money(total) + ' of ' + money(max) + '"><div class="fill" style="width:' + pct + '%"></div></div><div class="marks">' + marks + '</div>';
}

}

    '<div class="card soft"><p style="margin:0"><strong>Two for one:</strong> the same morning can record a course lesson. See the <a href="#build">Build tab</a>.</p></div>' +
    '<h2 class="section">Before anything goes public</h2>' +
    '<div class="card warn"><ol style="padding-left:1.2em;margin:0"><li>No founder, company or deck named without written permission.</li><li>Nothing that sounds like investment, introductions or Bay Angels access.</li><li>Would you say it to the founder\'s face?</li><li>Captions on, and a link to pitchanangel.com.</li><li>Note it down, to keep your streak.</li></ol></div>';
  },
  start: function () {
    return '<p>You will not use every tool in month one, and you do not need to. The tools come with time. The habit of handing work off is what to build now.</p>' +
    '<div class="tl">' +
    '<div class="it"><p class="when">Week 1, to 3 November</p><p><strong>Get set up.</strong> Philip sets up your ChatGPT project files and Zoom transcripts. Try voice mode on one real email.</p></div>' +
    '<div class="it"><p class="when">Week 2, 4 to 10 November</p><p><strong>One founder, end to end.</strong> Prep packet, session, and the report within 48 hours, with ChatGPT\'s help.</p></div>' +
    '<div class="it"><p class="when">Week 3, 11 to 17 November</p><p><strong>Your third article.</strong> Talk out "You are pitching investors, not selling the product." Edit the draft and publish it yourself.</p></div>' +
    '<div class="it"><p class="when">Week 4, 18 to 24 November</p><p><strong>First batch hour.</strong> Record six answers. Post one clip and one LinkedIn post.</p></div>' +
    '</div><div class="card gold"><p style="margin:0"><strong>Every day:</strong> before any task, ask the one question. Does this need my body or my presence?</p></div>';
  },
  where: function () {
    return tbl(['What', 'Where'], [
      ['This guide', 'rogers-tech-guide.vercel.app, on your home screen'],
      ['Your review desk', '<a href="https://www.pitchanangel.com/admin" target="_blank" rel="noopener">pitchanangel.com/admin</a>'],
      ['Your articles', '<a href="https://www.pitchanangel.com/resources" target="_blank" rel="noopener">pitchanangel.com/resources</a>'],
      ['Prompts for any founder', '<a href="#ai">The ChatGPT tab</a>'],
      ['Your offers and prices', '<a href="#offers">The Offers tab</a>'],
      ['The slide version of this guide', '<a href="' + DECK_URL + '" target="_blank" rel="noopener">On claude.ai</a> (Philip shares it with you)'],
      ['Social media basics', '<a href="/classic.html">The original guide</a>'],
      ['Any question', 'Ask your ChatGPT project first. Then Philip.']
    ]);
  }
};

function pageGuide() {
  var sub = (location.hash.split('/')[1] || '').split('?')[0];
  var i = -1;
  CHAPTERS.forEach(function (c, k) { if (c.id === sub) i = k; });
  if (i < 0) {
    return '<p class="eyebrow">Your field guide</p><h1>Your business, your AI, and how founders find you.</h1>' +
      '<p class="lead">The same five parts as the field guide Philip made for you, kept up to date here. Read one part a day. Nothing here is homework.</p>' +
      CHAPTERS.map(function (c) { return '<a class="card chapter" href="#guide/' + c.id + '">' + (c.n ? '<span class="n">' + c.n + '</span>' : '<span class="n dot"></span>') + '<span><span class="ct">' + esc(c.title) + '</span><span class="cw">' + esc(c.what) + '</span></span></a>'; }).join('') +
      '<div class="card soft" style="margin-top:24px"><p class="quote" style="margin:0 0 6px">Ask the question. Hand it off. Then do the part only you can do.</p><p style="margin:0">Be in the room with founders.</p></div>' +
      '<p class="small">If you only have ten minutes, read part 1. It changes how you approach everything else.</p>';
  }
  var c = CHAPTERS[i], prev = CHAPTERS[i - 1], next = CHAPTERS[i + 1];
  return '<p><a href="#guide" class="linkback">All parts</a></p><p class="eyebrow">' + (c.n ? 'Part ' + c.n : 'Getting started') + '</p><h1>' + esc(c.title) + '</h1>' +
    CHAPTER_HTML[c.id]() +
    '<div class="row pager">' + (prev ? '<a class="btn ghost small" href="#guide/' + prev.id + '">Back: ' + esc(prev.title) + '</a>' : '') + (next ? '<a class="btn small" href="#guide/' + next.id + '">Next: ' + esc(next.title) + '</a>' : '<a class="btn small" href="#guide">All parts</a>') + '</div>';
}

var PAGES = { today: pageToday, plan: pagePlan, offers: pageOffers, guide: pageGuide, ai: pageAI, build: pageBuild, check: pageCheck };
var TITLES = { today: 'Today', plan: 'Plan', offers: 'Offers', guide: 'Field guide', ai: 'ChatGPT', build: 'Build', check: 'The 30-day test' };

/* ---------- render ---------- */
var main = document.getElementById('main');
function route() { var h = (location.hash || '#today').slice(1).split(/[?\/]/)[0]; return PAGES[h] ? h : 'today'; }

function renderNav(r) {
  var html = TABS.map(function (t) { return '<a class="tab" href="#' + t[0] + '"' + (r === t[0] ? ' aria-current="page"' : '') + '>' + ICONS[t[0]] + '<span>' + t[1] + '</span></a>'; }).join('');
  document.getElementById('tabbar').innerHTML = html;
  document.getElementById('sideTabs').innerHTML = html;
}

function render(keepScroll) {
  var r = route();
  var y = window.scrollY;
  var open = Array.prototype.map.call(main.querySelectorAll('details[open]'), function (d) { return d.querySelector('summary').textContent; });
  main.innerHTML = PAGES[r]();
  if (keepScroll) {
    Array.prototype.forEach.call(main.querySelectorAll('details'), function (d) { if (open.indexOf(d.querySelector('summary').textContent) >= 0) d.open = true; });
    window.scrollTo(0, y);
  }
  renderNav(r);
  document.title = TITLES[r] + ' · Roger\'s Guide';
}

window.addEventListener('hashchange', function () {
  render(false);
  window.scrollTo(0, 0);
  main.focus({ preventScroll: true });
});

function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 1800); }

function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).then(function () { toast('Copied. Paste it into ChatGPT or your email.'); }, function () { fallback(); });
  fallback();
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied.'); } catch (e) { toast('Press and hold to copy.'); } document.body.removeChild(ta);
  }
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (act === 'check') { var c = checks(); c[id] = !c[id]; store.set('checks', c); render(true); }
  else if (act === 'daily') { var all = store.get('daily', {}); var k = todayKey(); all[k] = all[k] || {}; all[k][id] = !all[k][id]; store.set('daily', all); render(true); }
  else if (act === 'close-intro') { store.set('introClosed', true); render(true); }
  else if (act === 'msg-plus' || act === 'msg-minus') { var mc = msgCounts(); var tk2 = todayKey(); mc[tk2] = Math.max(0, (mc[tk2] || 0) + (act === 'msg-plus' ? 1 : -1)); store.set('msgCounts', mc); if (act === 'msg-plus' && mc[tk2] === 5) toast('Five sent. That is today done.'); render(true); }
  else if (act === 'add-pay') {
    var amt = parseFloat(String(document.getElementById('payAmt').value).replace(/[^0-9.]/g, ''));
    if (!amt) { toast('Type an amount first.'); return; }
    var ps = payments(); var now = new Date();
    ps.push({ id: uid(), amount: amt, who: document.getElementById('payWho').value.trim(), date: now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), ts: now.toISOString() });
    store.set('payments', ps); toast('Logged ' + money(amt) + '.'); render(true);
  }
  else if (act === 'del-pay') { store.set('payments', payments().filter(function (p) { return p.id !== id; })); render(true); }
  else if (act === 'calc') { var cs = counts(); cs[id] = Math.max(0, (cs[id] || 0) + parseInt(b.getAttribute('data-d'), 10)); store.set('calcCounts', cs); render(true); }
  else if (act === 'calc-reset') { store.set('calcCounts', {}); render(true); }
  else if (act === 'take-reset') { store.set('calcTakes', {}); render(true); }
  else if (act === 'recipe') { store.set('calcCounts', Object.assign({}, RECIPES[id].counts)); render(true); var el = document.getElementById('calc'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }
  else if (act === 'add-person') {
    var nm = document.getElementById('pName').value.trim(); if (!nm) { toast('Type a name first.'); return; }
    var ppl = people(); ppl.push({ id: uid(), name: nm, group: document.getElementById('pGroup').value, note: document.getElementById('pNote').value.trim(), s: 0 });
    store.set('people', ppl); render(true);
  }
  else if (act === 'cycle') { var pp = people().map(function (p) { if (p.id === id) p.s = (p.s + 1) % STATES.length; return p; }); store.set('people', pp); render(true); }
  else if (act === 'del-person') { store.set('people', people().filter(function (p) { return p.id !== id; })); render(true); }
  else if (act === 'copy') { var src = document.getElementById(b.getAttribute('data-src')); if (src) copyText(src.textContent); }
  else if (act === 'clear-fields') { store.set('fields', {}); render(true); }
  else if (act === 'answer') { var a = store.get('checkAnswers', {}); a[id] = b.getAttribute('data-v'); store.set('checkAnswers', a); render(true); }
  else if (act === 'check-reset') { store.set('checkAnswers', {}); store.set('checkNote', ''); render(false); window.scrollTo(0, 0); }
  else if (act === 'choose') { var st = store.get('chooser', {}); var q = b.getAttribute('data-q'); st[q] = b.getAttribute('data-v'); if (q === 'who') { delete st.when; delete st.what; } if (q === 'when') delete st.what; store.set('chooser', st); render(true); }
  else if (act === 'choose-reset') { store.set('chooser', {}); render(true); }
});

document.addEventListener('input', function (e) {
  var el = e.target, act = el.getAttribute && el.getAttribute('data-act'); if (!act) return;
  var id = el.getAttribute('data-id');
  if (act === 'field') {
    var f = fields(); f[id] = el.value; store.set('fields', f);
    PROMPTS.forEach(function (p) {
      var pre = document.getElementById('pr-' + p.id); if (pre) pre.textContent = fillPrompt(p.body);
      var d = main.querySelector('details[data-prompt="' + p.id + '"] > summary'); if (d) d.textContent = fillTitle(p.title);
    });
  }
  else if (act === 'take') { var t = takes(); var v = parseFloat(String(el.value).replace(/[^0-9.]/g, '')); if (isNaN(v)) return; t[id] = v; store.set('calcTakes', t); }
  else if (act === 'check-note') { store.set('checkNote', el.value); }
});
document.addEventListener('change', function (e) { if (e.target.getAttribute && e.target.getAttribute('data-act') === 'take') render(true); });

render(false);
})();
</script>
</body>
</html>
