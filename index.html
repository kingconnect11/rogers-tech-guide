<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Roger's Guide">
<title>Roger's Guide — AI, Social Media & Technology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Source Sans 3',-apple-system,sans-serif;font-size:18px;line-height:1.7;color:#1a2744;background:#faf8f5;overflow-x:hidden;-webkit-font-smoothing:antialiased}
:root{
--navy:#1a2744;--navy-light:#2a3d5e;--cream:#faf8f5;--ivory:#f5f0e8;
--gold:#c8956c;--gold-light:#dbb08a;--gold-dark:#a67c52;
--warm-blue:#4a6fa5;--sage:#7a9e7e;--sage-light:#a8c5ab;
--text:#1a2744;--text-light:#5a6a7e;--text-muted:#8a95a5;
--border:#e8e0d4;--shadow:rgba(26,39,68,0.08);--shadow-md:rgba(26,39,68,0.12);
--radius:12px;--radius-lg:20px;--radius-sm:8px;
--transition:0.3s cubic-bezier(0.4,0,0.2,1);
--nav-height:72px;--sidebar-width:260px;--content-max:760px;
}
h1,h2,h3,h4,h5{font-family:'Playfair Display',Georgia,serif;font-weight:700;line-height:1.25;color:var(--navy)}
h1{font-size:clamp(2rem,5vw,3.2rem);letter-spacing:-0.02em}
h2{font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:-0.01em}
h3{font-size:clamp(1.25rem,3vw,1.6rem)}
h4{font-size:1.15rem;font-weight:600}
p{margin-bottom:1em;color:var(--text)}
a{color:var(--gold-dark);text-decoration:none;transition:color var(--transition)}
a:hover{color:var(--gold)}
strong{font-weight:600}
img{max-width:100%;height:auto;display:block}
#root{min-height:100vh;display:flex;flex-direction:column}

/* NAV MOBILE */
.mobile-nav{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(250,248,245,0.88);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;align-items:center}
.mnb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:none;background:none;cursor:pointer;min-width:48px;min-height:44px;border-radius:var(--radius-sm);transition:all var(--transition);-webkit-tap-highlight-color:transparent}
.mnb svg{width:22px;height:22px;stroke:var(--text-muted);transition:all var(--transition);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mnb span{font-size:10px;font-weight:600;color:var(--text-muted);letter-spacing:0.02em;transition:color var(--transition)}
.mnb.active svg{stroke:var(--gold)}.mnb.active span{color:var(--gold)}
.mnb:active{transform:scale(0.92)}

/* NAV SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar-width);height:100vh;background:var(--cream);border-right:1px solid var(--border);padding:32px 20px;display:none;flex-direction:column;overflow-y:auto;z-index:100}
.sidebar-logo{font-family:'Playfair Display',serif;font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:8px;cursor:pointer;transition:color var(--transition)}
.sidebar-logo:hover{color:var(--gold)}
.sidebar-sub{font-size:13px;color:var(--text-muted);margin-bottom:32px;line-height:1.5}
.slink{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--radius-sm);font-size:15px;font-weight:500;color:var(--text-light);cursor:pointer;transition:all var(--transition);margin-bottom:2px;border:none;background:none;width:100%;text-align:left}
.slink:hover{background:var(--ivory);color:var(--navy)}
.slink.active{background:var(--ivory);color:var(--gold-dark);font-weight:600}
.slink svg{width:20px;height:20px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sdiv{height:1px;background:var(--border);margin:16px 0}
.sfooter{margin-top:auto;padding-top:20px;font-size:13px;color:var(--text-muted);line-height:1.5}

/* MAIN */
.main-content{flex:1;padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom) + 20px);min-height:100vh}

/* HERO */
.hero{position:relative;min-height:85vh;display:flex;flex-direction:column;justify-content:center;padding:60px 24px 40px;overflow:hidden}
.hero-bg{position:absolute;top:0;left:0;right:0;bottom:0;z-index:0}
.hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.hero-bg::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(26,39,68,0.55) 0%,rgba(26,39,68,0.70) 50%,rgba(26,39,68,0.88) 100%)}
.hero-content{position:relative;z-index:1;max-width:var(--content-max);margin:0 auto;text-align:center}
.hero h1{color:#fff;font-size:clamp(2.2rem,6vw,3.6rem);margin-bottom:16px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,0.2)}
.hero-sub{color:rgba(255,255,255,0.85);font-size:clamp(1.05rem,2.5vw,1.3rem);font-weight:300;max-width:540px;margin:0 auto 12px;line-height:1.6}
.hero-from{color:var(--gold-light);font-family:'Playfair Display',serif;font-style:italic;font-size:1.05rem;margin-top:8px}
.hero-scroll{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:1;color:rgba(255,255,255,0.5);animation:bounce 2.5s ease-in-out infinite;cursor:pointer}
.hero-scroll svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2}
@keyframes bounce{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

/* CARDS GRID */
.cards-section{padding:48px 24px 60px;max-width:960px;margin:0 auto}
.cards-title{text-align:center;font-size:1rem;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--text-muted);margin-bottom:32px}
.cards-grid{display:grid;grid-template-columns:1fr;gap:16px}
.scard{position:relative;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;gap:20px;overflow:hidden;min-height:88px}
.scard::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:4px 0 0 4px;transition:width var(--transition)}
.scard:hover{transform:translateY(-3px);box-shadow:0 8px 32px var(--shadow-md);border-color:transparent}
.scard:hover::before{width:5px}
.scard:active{transform:translateY(-1px)}
.cicon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:transform var(--transition)}
.scard:hover .cicon{transform:scale(1.08)}
.ctxt{flex:1}
.clbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:4px}
.cttl{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;color:var(--navy);margin-bottom:4px}
.cdsc{font-size:14px;color:var(--text-light);line-height:1.5;margin:0}
.carr{color:var(--text-muted);transition:all var(--transition);flex-shrink:0}
.carr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
.scard:hover .carr{color:var(--gold);transform:translateX(4px)}
.cg::before{background:var(--gold)}.cg .cicon{background:rgba(200,149,108,0.12)}.cg .clbl{color:var(--gold-dark)}
.cb::before{background:var(--warm-blue)}.cb .cicon{background:rgba(74,111,165,0.12)}.cb .clbl{color:var(--warm-blue)}
.cn::before{background:var(--navy)}.cn .cicon{background:rgba(26,39,68,0.10)}.cn .clbl{color:var(--navy-light)}
.cs::before{background:var(--sage)}.cs .cicon{background:rgba(122,158,126,0.12)}.cs .clbl{color:var(--sage)}
.ca::before{background:#c0884a}.ca .cicon{background:rgba(192,136,74,0.12)}.ca .clbl{color:#b07a40}
.ct::before{background:#5a8fa8}.ct .cicon{background:rgba(90,143,168,0.12)}.ct .clbl{color:#4a7f98}
.ck::before{background:linear-gradient(135deg,var(--gold),var(--warm-blue))}.ck .cicon{background:linear-gradient(135deg,rgba(200,149,108,0.15),rgba(74,111,165,0.15))}.ck .clbl{color:var(--gold-dark)}

/* SECTION PAGE */
.section-page{padding:0 0 40px}
.shero{position:relative;height:280px;overflow:hidden}
.shero img{width:100%;height:100%;object-fit:cover}
.shero-ov{position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(to bottom,rgba(26,39,68,0.3) 0%,rgba(26,39,68,0.75) 100%);display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
.shero-lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold-light);margin-bottom:8px}
.shero-ttl{color:#fff;font-size:clamp(1.8rem,4.5vw,2.6rem);text-shadow:0 2px 8px rgba(0,0,0,0.2)}
.sbody{max-width:var(--content-max);margin:0 auto;padding:32px 24px}
.sintro{font-size:1.1rem;line-height:1.8;color:var(--text);margin-bottom:36px;font-weight:300}
.sintro strong{font-weight:600}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 0;margin-bottom:8px;border:none;background:none;cursor:pointer;font-size:15px;font-weight:500;color:var(--text-muted);transition:color var(--transition);-webkit-tap-highlight-color:transparent}
.back-btn:hover{color:var(--gold)}
.back-btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}

/* ACCORDION */
.acc{margin-bottom:16px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:#fff}
.acc-h{display:flex;align-items:center;gap:14px;width:100%;padding:18px 20px;border:none;background:#fff;cursor:pointer;text-align:left;font-family:'Playfair Display',serif;font-size:1.1rem;font-weight:600;color:var(--navy);transition:all var(--transition);-webkit-tap-highlight-color:transparent;min-height:56px}
.acc-h:hover{background:var(--ivory)}
.acc-chev{margin-left:auto;flex-shrink:0;transition:transform 0.35s cubic-bezier(0.4,0,0.2,1);color:var(--text-muted)}
.acc-chev svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.5}
.acc.open .acc-chev{transform:rotate(180deg);color:var(--gold)}
.acc-body{max-height:0;overflow:hidden;transition:max-height 0.45s cubic-bezier(0.4,0,0.2,1)}
.acc.open .acc-body{max-height:8000px}
.acc-content{padding:4px 20px 24px;font-size:17px;line-height:1.75}
.acc-content p{margin-bottom:14px}
.acc-content ul,.acc-content ol{margin:12px 0 18px 20px}
.acc-content li{margin-bottom:8px}
.acc-content h4{margin:20px 0 10px;font-family:'Source Sans 3',sans-serif}

/* PROMPT BLOCK */
.pb{position:relative;background:var(--navy);border-radius:var(--radius);padding:20px;margin:20px 0 24px;overflow:hidden}
.pb::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--warm-blue))}
.pb pre{font-family:'JetBrains Mono',monospace;font-size:14px;line-height:1.65;color:rgba(255,255,255,0.9);white-space:pre-wrap;word-break:break-word;margin:0;padding-right:40px}
.pb-copy{position:absolute;top:14px;right:14px;padding:8px 16px;border:1px solid rgba(255,255,255,0.2);border-radius:var(--radius-sm);background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.7);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;gap:6px;min-height:36px;-webkit-tap-highlight-color:transparent}
.pb-copy:hover{background:rgba(255,255,255,0.15);color:#fff;border-color:rgba(255,255,255,0.3)}
.pb-copy.copied{background:rgba(122,158,126,0.3);border-color:var(--sage);color:var(--sage-light)}
.pb-copy svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* STEPS */
.steps{margin:20px 0}
.step{display:flex;gap:16px;margin-bottom:24px;position:relative}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;margin-top:2px}
.step-line{position:absolute;top:40px;left:18px;width:2px;bottom:-8px;background:var(--border)}
.step:last-child .step-line{display:none}
.step-content{flex:1}
.step-title{font-weight:600;font-size:17px;margin-bottom:6px}

/* TABLE */
.tw{overflow-x:auto;margin:20px 0;-webkit-overflow-scrolling:touch}
.ctable{width:100%;border-collapse:collapse;font-size:15px;min-width:480px}
.ctable th{text-align:left;padding:12px 14px;background:var(--navy);color:#fff;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:0.05em}
.ctable th:first-child{border-radius:var(--radius-sm) 0 0 0}.ctable th:last-child{border-radius:0 var(--radius-sm) 0 0}
.ctable td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5}
.ctable tr:nth-child(even) td{background:var(--ivory)}
.ctable td:first-child{font-weight:600;color:var(--navy);white-space:nowrap}

/* PROJECT CARDS */
.pcards{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}
.pcard{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:all var(--transition)}
.pcard:hover{box-shadow:0 4px 16px var(--shadow);transform:translateY(-2px)}
.pcard-t{font-family:'Playfair Display',serif;font-weight:600;font-size:1rem;margin-bottom:4px}
.pcard-d{font-size:14px;color:var(--text-light);margin:0 0 8px;line-height:1.5}
.ptag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.tag-c{background:rgba(74,111,165,0.12);color:var(--warm-blue)}
.tag-w{background:rgba(200,149,108,0.15);color:var(--gold-dark)}
.tag-r{background:rgba(122,158,126,0.12);color:var(--sage)}

/* PLATFORM CARD */
.plat{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:16px}
.plat-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.plat-icon{font-size:28px}
.plat-name{font-family:'Playfair Display',serif;font-weight:700;font-size:1.2rem}
.plat-purp{font-weight:600;color:var(--gold-dark);font-size:15px;margin-bottom:8px}
.plat ul{margin:8px 0 8px 20px}
.plat li{margin-bottom:6px;font-size:16px}
.plat-bl{margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-weight:600;font-size:15px;color:var(--navy)}

/* CALLOUT */
.co{border-left:4px solid var(--gold);background:var(--ivory);padding:16px 20px;border-radius:0 var(--radius-sm) var(--radius-sm) 0;margin:16px 0 20px}
.co.tip{border-left-color:var(--sage)}.co.info{border-left-color:var(--warm-blue)}
.co-l{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.co p:last-child{margin-bottom:0}

/* CONTENT PHOTO */
.cphoto{border-radius:var(--radius);overflow:hidden;margin:24px 0;box-shadow:0 4px 20px var(--shadow)}
.cphoto img{width:100%;display:block}
.cphoto-cap{padding:10px 16px;background:var(--ivory);font-size:13px;color:var(--text-muted);font-style:italic}

/* PHOTO POST CARD */
.post-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin:24px 0}
.post-card-img{height:200px;overflow:hidden}
.post-card-img img{width:100%;height:100%;object-fit:cover}
.post-card-body{padding:20px}
.post-card-body h4{margin-bottom:12px;font-family:'Playfair Display',serif}
.post-platforms{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.post-plat-tag{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--ivory);color:var(--text-light)}
.post-plat-tag.ig{background:rgba(193,53,132,0.1);color:#c13584}
.post-plat-tag.tt{background:rgba(0,0,0,0.06);color:#333}
.post-plat-tag.fb{background:rgba(24,119,242,0.1);color:#1877f2}
.post-plat-tag.li{background:rgba(10,102,194,0.1);color:#0a66c2}
.post-caption{font-size:15px;line-height:1.6;color:var(--text);margin:8px 0;padding:12px 14px;background:var(--ivory);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--transition);border:1px solid transparent}
.post-caption:hover{border-color:var(--gold)}
.post-caption.copied-cap{border-color:var(--sage);background:rgba(122,158,126,0.06)}
.post-caption-hint{font-size:11px;color:var(--text-muted);font-style:italic;text-align:right;margin-top:4px}
.post-biz{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.post-biz-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--gold-dark);margin-bottom:6px}
.post-biz ul{margin:4px 0 0 16px;font-size:14px}
.post-biz li{margin-bottom:4px;color:var(--text-light)}

/* CAMERA DIVIDER */
.cdiv{display:flex;align-items:center;justify-content:center;gap:16px;margin:40px 0;color:var(--border)}
.cdiv::before,.cdiv::after{content:'';flex:1;height:1px;background:var(--border)}
.cdiv svg{width:24px;height:24px;stroke:var(--gold-light);fill:none;stroke-width:1.5;flex-shrink:0}

/* DECISION GUIDE */
.dl{margin:16px 0}
.di{display:flex;align-items:baseline;gap:12px;padding:8px 0;font-size:16px}
.di .q{color:var(--text-light);flex-shrink:0}.di .ar{color:var(--gold);font-weight:700;flex-shrink:0}.di .a{font-weight:600;color:var(--navy)}

/* FUN PROMPT TILE */
.fpg{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}
.fpt{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;cursor:pointer;transition:all var(--transition);display:flex;align-items:flex-start;gap:12px}
.fpt:hover{border-color:var(--gold);box-shadow:0 2px 12px var(--shadow)}
.fpt.cop{border-color:var(--sage);background:rgba(122,158,126,0.05)}
.fti{font-size:22px;flex-shrink:0;margin-top:2px}
.ftt{font-size:15px;line-height:1.5;color:var(--text)}
.fth{font-size:12px;color:var(--text-muted);margin-top:4px;font-style:italic}

/* CLOSING MSG */
.cmsg{background:linear-gradient(135deg,var(--ivory),rgba(200,149,108,0.08));border-radius:var(--radius-lg);padding:28px 24px;margin-top:32px;border:1px solid rgba(200,149,108,0.2)}
.cmsg p{font-size:17px;line-height:1.75}
.cmsg p:last-child{margin-bottom:0}

/* PHILIP NOTE */
.pnote{text-align:center;padding:40px 24px;margin:0 24px 20px;border:2px dashed var(--gold-light);border-radius:var(--radius-lg);background:rgba(200,149,108,0.04)}
.pnote-l{font-family:'Playfair Display',serif;font-style:italic;color:var(--gold-dark);font-size:1.1rem;margin-bottom:8px}
.pnote p{color:var(--text-muted);font-size:15px;margin:0}

/* BEFORE/AFTER */
.ba{margin:16px 0}
.bai{padding:14px 16px;border-radius:var(--radius-sm);margin-bottom:8px}
.ba-bad{background:rgba(200,80,80,0.08);border-left:3px solid #c85050}
.ba-good{background:rgba(122,158,126,0.08);border-left:3px solid var(--sage)}
.ba-l{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.ba-bad .ba-l{color:#c85050}.ba-good .ba-l{color:var(--sage)}
.ba-t{font-size:15px;color:var(--text);margin:0;font-style:italic}

/* PROGRESS */
.pchk{display:flex;align-items:center;gap:10px;margin:-4px 0 16px}
.pchk input[type="checkbox"]{width:20px;height:20px;accent-color:var(--sage);cursor:pointer}
.pchk label{font-size:14px;color:var(--text-muted);cursor:pointer;user-select:none}

/* AUTOMATION WORKFLOW */
.workflow{display:flex;flex-direction:column;gap:0;margin:20px 0}
.wf-step{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#fff;border:1px solid var(--border);position:relative}
.wf-step:first-child{border-radius:var(--radius) var(--radius) 0 0}
.wf-step:last-child{border-radius:0 0 var(--radius) var(--radius)}
.wf-step:not(:last-child){border-bottom:none}

const [page,setPage]=useState(()=>{const h=window.location.hash.replace('#','');return h||'home'});
const [prog,toggle]=useProgress();
useEffect(()=>{const h=()=>{const hash=window.location.hash.replace('#','');if(hash)setPage(hash)};window.addEventListener('hashchange',h);return()=>window.removeEventListener('hashchange',h)},[]);
const nav=useCallback(id=>{setPage(id);window.location.hash=id;window.scrollTo({top:0,behavior:'smooth'})},[]);
const home=useCallback(()=>{setPage('home');window.location.hash='home';window.scrollTo({top:0,behavior:'smooth'})},[]);

const MAP={'getting-started':S1,'ai-personal':S2,'ai-professional':S3,'social-personal':S4,'social-professional':S5,'travel':S6,'cool-stuff':S7};
const sec=SECTIONS.find(s=>s.id===page);
const Comp=MAP[page];
const activeNav=page==='home'?'home':page==='getting-started'?'getting-started':page.startsWith('ai-')?'ai-personal':page.startsWith('social-')?'social-personal':page==='travel'?'travel':page==='cool-stuff'?'cool-stuff':'home';

return(<>
<nav className="sidebar">
<div className="sidebar-logo" onClick={home}>Roger's Guide</div>
<div className="sidebar-sub">AI, Social Media & Technology</div>
<button className={`slink ${page==='home'?'active':''}`} onClick={home}>{I.home}<span>Home</span></button>
<div className="sdiv"/>
{SECTIONS.map(s=><button key={s.id} className={`slink ${page===s.id?'active':''}`} onClick={()=>nav(s.id)}><span style={{fontSize:'18px',width:'20px',textAlign:'center'}}>{s.icon}</span><span>{s.title}</span></button>)}
<div className="sfooter"><p>Built with love by Philip.<br/>Powered by Claude.</p></div>
</nav>
<main className="main-content">
{page==='home'&&<Landing onNav={nav}/>}
{Comp&&sec&&<Comp section={sec} onBack={home} prog={prog} toggle={toggle}/>}
</main>
<nav className="mobile-nav">{NAV.map(item=>(
<button key={item.id} className={`mnb ${activeNav===item.id?'active':''}`} onClick={()=>item.id==='home'?home():nav(item.id)}>{item.icon}<span>{item.label}</span></button>
))}</nav>
</>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
